name: Hub Revision Receipt Contract (Isolated)
on:
  pull_request:
    paths:
      - 'api/publish.js'
      - 'tests/publish-handler-preconnect.test.js'
      - 'lib/publish-atomic-fixture.cjs'
      - 'tests/publish-atomic-fixture.test.cjs'
      - 'lib/publish-receipt-contract.cjs'
      - 'tests/publish-receipt-contract.test.cjs'
      - 'lib/publish-receipt-transaction-prototype.cjs'
      - 'tests/publish-receipt-transaction-prototype.test.cjs'
      - '.github/workflows/publish-receipt-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test tests/publish-receipt-contract.test.cjs tests/publish-receipt-transaction-prototype.test.cjs tests/publish-atomic-fixture.test.cjs tests/publish-handler-preconnect.test.js
