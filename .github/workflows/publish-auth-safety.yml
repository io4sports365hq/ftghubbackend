name: Hub Publishing Safety (No Database)
on:
  pull_request:
    paths:
      - 'api/publish.js'
      - 'tests/publish-auth.test.js'
      - '.github/workflows/publish-auth-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test tests/publish-auth.test.js
