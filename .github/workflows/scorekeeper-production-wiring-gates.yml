name: Scorekeeper Hub Production wiring gates (isolated)
on:
  pull_request:
    paths:
      - 'api/scorekeeper-service-*.js'
      - 'lib/scorekeeper-*.proposed.*'
      - 'lib/hub-*.proposed.js'
      - 'tests/scorekeeper-*-gates.test.mjs'
      - 'tests/scorekeeper-production-routes.test.mjs'
      - 'package.json'
      - '.github/workflows/scorekeeper-production-wiring-gates.yml'
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: VERCEL_ENV=preview node --test tests/scorekeeper-production-routes.test.mjs tests/scorekeeper-registered-gates.test.mjs
      - run: VERCEL_ENV=production IO4_SCOREKEEPER_HUB_ENABLED=false node --test tests/scorekeeper-registered-gates.test.mjs
